name: Verify shared editor
# PR 브랜치는 pull_request로 한 번만 검증하고, push는 병합 후 main만 검증한다.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# 테스트 레벨과 규칙: docs/TESTING.md
# 산출물은 실행마다 커밋 SHA를 붙여 90일 보관한다. Actions 탭 → 실행 → Artifacts에서 내려받는다.
jobs:
  # 단위 + 통합 (Vitest). 커버리지 하한선(vite.config.ts thresholds) 미달 시 실패한다.
  unit-integration:
    name: 단위·통합 테스트와 커버리지
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: 단위 테스트
        run: npm run test:unit
      - name: 통합 테스트
        run: npm run test:integration
      # 단위·통합 전체를 다시 실행하므로 reports/vitest.json도 이 단계의 결과가 최종본이다.
      - name: 커버리지 측정과 하한선 검사
        if: success() || failure()
        run: npm run test:coverage
      - name: 커버리지 요약을 작업 요약에 기록
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e '
          const t = require("./coverage/coverage-summary.json").total;
          const row = k => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
          console.log(["## 커버리지 (단위 + 통합)", "", "| 항목 | 비율 | 커버/전체 |", "| --- | --- | --- |",
            ...["statements", "branches", "functions", "lines"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - name: 커버리지 리포트 업로드
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 90
      - name: Vitest 결과 업로드 (추적표 입력)
        if: always() && hashFiles('reports/vitest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: reports/vitest.json
          retention-days: 7

  # 시스템 + 인수 (Playwright). 빌드 결과물을 preview로 띄워 실제 Chromium에서 실행한다.
  # 두 프로젝트를 한 번에 실행해야 reports/playwright.json에 둘 다 기록된다. 한쪽이 실패해도 다른 쪽은 끝까지 실행된다.
  e2e:
    name: 시스템·인수 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: 시스템·인수 테스트
        run: npm run test:e2e
      - name: Playwright 결과 업로드 (추적표 입력)
        if: always() && hashFiles('reports/playwright.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: reports/playwright.json
          retention-days: 7
      - name: Playwright 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 90

  # 요구사항 추적표. 두 테스트 job이 실패해도 결과가 있으면 만든다.
  # SPEC 태그가 없거나 기능명세에 없는 번호를 쓴 테스트가 있으면 실패한다.
  trace:
    name: 요구사항 추적표
    needs: [unit-integration, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-results'
          path: reports
          merge-multiple: true
      - name: 추적표 생성과 태그 검사
        run: node scripts/test-trace.mjs
      - name: 추적표 업로드
        if: always() && hashFiles('reports/test-trace.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-trace-${{ github.sha }}
          path: reports/test-trace.md
          retention-days: 90
